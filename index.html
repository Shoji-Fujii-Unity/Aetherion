<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050a10">
<title>AETHERION ―天空回廊―</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;700&family=M+PLUS+Rounded+1c:wght@400;700;800&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#050a10; --ink2:#0b1a22; --panel:rgba(8,18,25,.82);
  --amber:#ffb03a; --gold:#ffd45e; --coral:#ff5f52; --mint:#5fe3c0;
  --paper:#f6ecd9; --dim:rgba(246,236,217,.55);
  --disp:'Bungee','Mochiy Pop One',cursive;
  --jp:'Mochiy Pop One','M PLUS Rounded 1c',sans-serif;
  --body:'M PLUS Rounded 1c','Chakra Petch',system-ui,sans-serif;
  --mono:'Chakra Petch',ui-monospace,monospace;
  --cut:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--paper);
  font-family:var(--body);touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
@supports (height:100dvh){html,body{height:100dvh}}
canvas{display:block;position:fixed;inset:0}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- ambient overlays ---------- */
#vig{position:fixed;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(120% 90% at 50% 45%,transparent 45%,rgba(0,0,0,.55) 100%),
             linear-gradient(180deg,rgba(3,10,16,.55),transparent 25%,transparent 72%,rgba(3,10,16,.6));}
#grain{position:fixed;inset:-50%;pointer-events:none;z-index:4;opacity:.05;
  background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px);
  animation:grain 1.2s steps(3) infinite}
@keyframes grain{0%{transform:translateY(0)}50%{transform:translateY(-2px)}100%{transform:translateY(1px)}}
#scan{position:fixed;left:0;right:0;height:26vh;z-index:5;pointer-events:none;opacity:.06;
  background:linear-gradient(180deg,transparent,rgba(255,212,94,.9),transparent);
  animation:scan 9s linear infinite}
@keyframes scan{0%{top:-30vh}100%{top:120vh}}

/* ---------- generic UI ---------- */
.screen{position:fixed;inset:0;z-index:20;opacity:0;pointer-events:none;transition:opacity .3s ease, transform .35s ease;
  transform:scale(1.01);overflow:auto}
.screen.show{opacity:1;pointer-events:auto;transform:none}
.hidden{display:none!important}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.btn{position:relative;display:inline-flex;align-items:center;gap:10px;padding:12px 20px;
  font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
  background:rgba(255,176,58,.08);border:1px solid rgba(255,176,58,.35);clip-path:var(--cut);
  transition:transform .16s ease,background .16s,color .16s,box-shadow .16s}
.btn:hover{background:rgba(255,176,58,.2);transform:translate(-2px,-2px)}
.btn:active{transform:translate(0,0)}
.btn.primary{background:linear-gradient(120deg,var(--amber),var(--gold));color:#1b1104;border:0;
  box-shadow:0 0 0 1px rgba(255,212,94,.5),0 10px 30px -12px rgba(255,176,58,.9)}
.btn.primary:hover{box-shadow:0 0 0 1px #fff,0 16px 40px -12px rgba(255,176,58,1);filter:brightness(1.06)}
.btn.ghost{background:rgba(255,255,255,.03);border-color:rgba(246,236,217,.22)}
.chip{padding:6px 10px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;border:1px solid rgba(246,236,217,.2);
  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));transition:.15s;color:var(--dim)}
.chip:hover{color:var(--paper);border-color:var(--amber)}
.chip.on{background:var(--amber);color:#1b1104;border-color:var(--amber);font-weight:700}

/* ---------- TITLE ---------- */
#s-title{display:grid;grid-template-columns:clamp(56px,7vw,90px) minmax(300px,1fr) minmax(260px,.85fr) clamp(16px,3vw,40px);
  grid-template-rows:auto 1fr auto;gap:0 18px;padding:clamp(14px,2.4vh,26px) 0;align-items:start}
.vstrip{grid-column:1;grid-row:1/4;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  border-left:1px solid rgba(255,176,58,.25);padding:8px 0}
.vstrip .vert{writing-mode:vertical-rl;font-family:var(--jp);font-size:clamp(16px,2.5vh,28px);letter-spacing:.34em;
  color:#fff;text-shadow:0 0 18px rgba(255,176,58,.6)}
.vstrip .dot{width:9px;height:9px;background:var(--amber);transform:rotate(45deg);animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:rotate(45deg) scale(.8)}50%{opacity:1;transform:rotate(45deg) scale(1.25)}}
.brand{grid-column:2;grid-row:1}
.brand .mark{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.brand h1{font-family:var(--disp);margin:0;font-size:clamp(34px,7.2vw,86px);line-height:.86;letter-spacing:.01em;
  color:#fff;text-shadow:0 0 26px rgba(255,176,58,.45),4px 4px 0 rgba(255,95,82,.55)}
.brand h1 em{font-style:normal;color:var(--gold)}
.brand .kana{font-family:var(--jp);font-size:clamp(11px,1.5vh,15px);letter-spacing:.5em;color:var(--amber);
  border:1px solid rgba(255,176,58,.4);padding:4px 10px;clip-path:var(--cut);margin-bottom:6px}
.brand p{max-width:56ch;margin:10px 0 0;font-size:clamp(11px,1.55vh,15px);color:rgba(246,236,217,.8);line-height:1.65}
.menu{grid-column:2;grid-row:2;align-self:center;display:flex;flex-direction:column;gap:8px;max-width:420px}
.mrow{display:flex;align-items:center;gap:16px;padding:10px 14px;border:1px solid rgba(246,236,217,.14);
  background:linear-gradient(90deg,rgba(9,22,30,.7),rgba(9,22,30,.15));clip-path:var(--cut);
  transition:.18s;text-align:left;width:100%}
.mrow .no{font-family:var(--mono);font-size:11px;color:var(--amber);letter-spacing:.2em;min-width:26px}
.mrow .tx{font-size:clamp(14px,2.1vh,20px);font-weight:800;letter-spacing:.05em}
.mrow .sub{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--dim)}
.mrow:hover{background:linear-gradient(90deg,rgba(255,176,58,.22),rgba(9,22,30,.1));transform:translateX(6px);
  border-color:rgba(255,176,58,.5)}
.mrow[disabled]{opacity:.35;pointer-events:none}
.savebox{grid-column:3;grid-row:1/3;align-self:start;margin-top:6px;padding:16px;border:1px solid rgba(246,236,217,.14);
  background:var(--panel);backdrop-filter:blur(7px);clip-path:var(--cut)}
.savebox h3{margin:0 0 12px;font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--gold)}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px dotted rgba(246,236,217,.13)}
.stat b{font-family:var(--disp);font-size:clamp(18px,2.8vh,28px);color:#fff;letter-spacing:.02em}
.pips{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.pip{width:16px;height:16px;background:rgba(246,236,217,.12);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);transition:.2s}
.pip.un{background:var(--amber)}.pip.done{background:var(--mint)}
.footbar{grid-column:2/4;grid-row:3;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding-top:14px;border-top:1px solid rgba(246,236,217,.12)}
.footbar .grp{display:flex;gap:6px;align-items:center}
.hintline{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim);margin-left:auto;text-align:right}

/* ---------- HEADINGS ---------- */
.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.head h2{font-family:var(--disp);font-size:clamp(20px,3.4vh,36px);margin:0;letter-spacing:.04em;color:#fff}
.head .jp{font-family:var(--jp);font-size:clamp(11px,1.6vh,15px);color:var(--amber);letter-spacing:.28em}
.pad{padding:clamp(14px,2.6vh,28px)}

/* ---------- SELECT ---------- */
#s-select .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.card{position:relative;padding:12px 13px 11px;text-align:left;border:1px solid rgba(246,236,217,.16);
  background:linear-gradient(160deg,rgba(255,255,255,.06),transparent 60%),var(--panel);clip-path:var(--cut);
  transition:.18s;overflow:hidden;min-height:96px;display:flex;flex-direction:column;gap:6px}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.card:after{content:"";position:absolute;right:-30%;top:-60%;width:120%;height:200%;opacity:.14;
  background:radial-gradient(circle,var(--c),transparent 62%);transition:.3s}
.card:hover{transform:translateY(-4px);border-color:var(--c)}
.card:hover:after{opacity:.32}
.card .num{font-family:var(--disp);font-size:clamp(20px,3.1vh,30px);line-height:1;color:var(--c)}
.card .nm{font-size:13px;font-weight:800;line-height:1.3;position:relative}
.card .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--dim)}
.card .stars{color:var(--gold)}
.card.lock{opacity:.42;pointer-events:none}
.card .lk{position:absolute;right:10px;top:10px;font-size:14px}
.card .bb{color:var(--mint)}

/* ---------- CODEX ---------- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.col{border:1px solid rgba(246,236,217,.14);background:var(--panel);clip-path:var(--cut);padding:12px}
.col h4{margin:0 0 10px;font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--gold)}
.row{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-bottom:1px dotted rgba(246,236,217,.1);transition:.15s}
.row:hover{background:rgba(255,176,58,.08)}
.ico{width:26px;height:26px;flex:0 0 26px;background:#888;transform:rotate(45deg);
  box-shadow:0 0 14px -2px currentColor;border:1px solid rgba(255,255,255,.4)}
.row b{display:block;font-size:13px;letter-spacing:.03em}
.row span{font-size:11.5px;color:var(--dim);line-height:1.45}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;opacity:0;transition:.25s}
#hud.show{opacity:1}
.hpwrap{position:absolute;left:clamp(10px,2vw,22px);top:clamp(10px,2vh,18px);display:flex;flex-direction:column;gap:6px}
#hearts{display:flex;gap:5px}
.ht{width:clamp(16px,2.4vh,22px);height:clamp(16px,2.4vh,22px);display:grid;place-items:center;
  color:var(--coral);font-size:clamp(15px,2.3vh,21px);text-shadow:0 0 12px rgba(255,95,82,.8);transition:.2s}
.ht.off{color:rgba(246,236,217,.18);text-shadow:none;transform:scale(.75)}
.ht.max{color:var(--gold);text-shadow:0 0 14px rgba(255,212,94,.9)}
#buffs{display:flex;gap:5px;flex-wrap:wrap}
.buff{font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:3px 7px;background:rgba(5,14,20,.75);
  border:1px solid rgba(95,227,192,.5);color:var(--mint);clip-path:polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,6px 100%,0 calc(100% - 6px))}
.topright{position:absolute;right:clamp(10px,2vw,22px);top:clamp(10px,2vh,18px);text-align:right}
#stgChip{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--gold)}
#stgName{font-family:var(--jp);font-size:clamp(12px,2vh,17px);letter-spacing:.12em;margin-top:3px;text-shadow:0 2px 10px #000}
#timer{font-family:var(--disp);font-size:clamp(20px,3.6vh,38px);line-height:1;margin-top:5px;text-shadow:0 3px 14px rgba(0,0,0,.7)}
#gemline{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--gold);margin-top:4px}
#prog{position:absolute;left:50%;transform:translateX(-50%);top:clamp(10px,2vh,18px);width:min(42%,340px);
  height:7px;background:rgba(5,14,20,.6);border:1px solid rgba(246,236,217,.2);clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 100%,0 100%)}
#progfill{height:100%;width:0%;background:linear-gradient(90deg,var(--mint),var(--gold));box-shadow:0 0 14px var(--gold);transition:width .2s}
#prog i{position:absolute;top:-6px;font-size:11px;line-height:1;color:var(--paper)}
#prog i.a{left:-16px}#prog i.b{right:-16px}
#bossbar{position:absolute;left:50%;transform:translateX(-50%);bottom:clamp(12px,3vh,26px);width:min(70%,520px);opacity:0;transition:.3s}
#bossbar.show{opacity:1}
#bosstrack{height:11px;background:rgba(5,14,20,.7);border:1px solid rgba(255,95,82,.6);clip-path:var(--cut)}
#bossfill{height:100%;background:linear-gradient(90deg,#ff5f52,#ffb03a);transition:width .2s}
#bossname{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--coral);text-align:center;margin-bottom:4px}
#toasts{position:absolute;left:50%;transform:translateX(-50%);top:22%;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{font-family:var(--jp);font-size:clamp(13px,2.2vh,19px);letter-spacing:.14em;padding:7px 16px;
  background:rgba(5,14,20,.72);border-left:3px solid var(--amber);animation:tin .35s ease both;text-shadow:0 2px 8px #000}
.toast.warn{border-color:var(--coral)}
@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
#hudbtns{position:absolute;right:clamp(10px,2vw,22px);top:calc(clamp(10px,2vh,18px) + 96px);display:flex;flex-direction:column;gap:7px;pointer-events:auto}
.ico-btn{width:38px;height:38px;display:grid;place-items:center;background:rgba(5,14,20,.65);
  border:1px solid rgba(246,236,217,.22);clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px));
  font-size:15px;transition:.16s}
.ico-btn:hover{border-color:var(--amber);color:var(--gold);transform:translateY(-2px)}

/* ---------- touch ---------- */
#touch{position:fixed;inset:0;z-index:12;pointer-events:none;display:none}
#touch.on{display:block}
#joybase{position:absolute;width:130px;height:130px;border-radius:50%;border:2px solid rgba(246,236,217,.25);
  background:radial-gradient(circle,rgba(255,176,58,.16),transparent 65%);opacity:0;transition:opacity .15s;transform:translate(-50%,-50%)}
#joyknob{position:absolute;width:56px;height:56px;border-radius:50%;background:rgba(255,212,94,.5);
  border:2px solid var(--gold);opacity:0;transform:translate(-50%,-50%)}
.tbtn{position:absolute;pointer-events:auto;width:clamp(58px,10vh,80px);height:clamp(58px,10vh,80px);border-radius:50%;
  display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.1em;
  background:rgba(6,16,22,.6);border:2px solid rgba(246,236,217,.3);color:#fff;transition:transform .1s,background .1s}
.tbtn:active,.tbtn.hit{transform:scale(.9);background:rgba(255,176,58,.45)}
#bJump{right:24px;bottom:clamp(24px,7vh,60px);border-color:var(--gold);color:var(--gold)}
#bAtk{right:clamp(96px,15vw,132px);bottom:clamp(38px,10vh,88px);border-color:var(--coral);color:#ffb3ad;width:clamp(66px,12vh,92px);height:clamp(66px,12vh,92px)}
#bDash{right:clamp(30px,5vw,54px);bottom:clamp(100px,20vh,160px);width:clamp(48px,7.5vh,62px);height:clamp(48px,7.5vh,62px);font-size:9px}

/* ---------- MODALS ---------- */
.modal{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:radial-gradient(60% 60% at 50% 50%,rgba(3,8,12,.72),rgba(3,8,12,.94))}
.box{width:min(680px,96%);max-height:92vh;overflow:auto;padding:clamp(18px,3vh,32px);
  background:linear-gradient(160deg,rgba(12,26,34,.96),rgba(6,14,20,.96));border:1px solid rgba(255,176,58,.3);clip-path:var(--cut);
  box-shadow:0 40px 90px -30px rgba(0,0,0,.9)}
.box h2{font-family:var(--disp);font-size:clamp(26px,5.4vh,56px);margin:0;line-height:.95;letter-spacing:.02em}
.big{font-family:var(--disp);font-size:clamp(30px,6.4vh,64px);line-height:1;color:#fff}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:18px 0}
.statgrid div{border:1px solid rgba(246,236,217,.14);padding:10px 12px;clip-path:var(--cut);background:rgba(255,255,255,.03)}
.statgrid b{display:block;font-family:var(--disp);font-size:clamp(19px,3.4vh,34px);line-height:1.1;margin-top:4px}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.kv{display:flex;gap:12px;padding:6px 0;font-size:13px;border-bottom:1px dotted rgba(246,236,217,.12)}
.kv b{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--amber);min-width:92px;padding-top:3px}
.newrec{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.24em;background:var(--gold);color:#1b1104;
  padding:3px 9px;margin-left:10px;vertical-align:middle;animation:pulse2 .9s infinite alternate}
@keyframes pulse2{to{filter:brightness(1.35)}}
#rotate{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:#04070c;text-align:center;padding:30px}
#rotate .ph{width:64px;height:104px;border:3px solid var(--amber);border-radius:10px;margin:0 auto 22px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,40%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
@media (max-width:820px){
  #s-title{grid-template-columns:48px 1fr 12px}
  .savebox{grid-column:2;grid-row:3;margin-top:14px}
  .footbar{grid-column:1/4}
  .brand p{display:none}
}
@media (max-width:600px){
  #s-title{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto;
    align-content:start;gap:14px 0;min-height:100vh;min-height:100dvh;
    padding: max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right))
             max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  .vstrip{display:none}
  .brand{grid-column:1;grid-row:1}
  .brand .mark{gap:8px}
  .brand h1{font-size:clamp(34px,12vw,62px)}
  .menu{grid-column:1;grid-row:2;align-self:start;max-width:none;width:100%;gap:6px}
  .mrow{padding:9px 12px}
  .savebox{grid-column:1;grid-row:3;margin:0;padding:12px}
  .savebox .stat{padding:4px 0}
  .savebox .pips{margin-top:8px}
  .footbar{grid-column:1;grid-row:4;padding-top:10px;gap:8px}
  .hintline{margin-left:0;text-align:left}
}
@media (max-width:600px) and (max-height:700px){
  #s-title{gap:8px 0;padding-top:max(10px,env(safe-area-inset-top));
    padding-bottom:max(10px,env(safe-area-inset-bottom))}
  .menu{gap:4px}
  .mrow{padding:6px 10px}
  .savebox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:9px}
  .savebox h3,.savebox .pips{display:none}
  .savebox .stat{display:flex;flex-direction:column;align-items:flex-start;gap:2px;
    min-width:0;padding:0;border:0}
  .savebox .stat .lbl{font-size:8px;letter-spacing:.08em}
  .savebox .stat b{font-size:16px}
  .footbar{gap:6px;padding-top:8px}
  .chip{padding:5px 7px}
}
@media (max-height:430px){
  #s-title{grid-template-columns:48px minmax(0,1fr) 12px;grid-template-rows:auto 1fr auto;
    padding:10px 0}
  .savebox{display:none}
  .brand p{display:none}
  .brand h1{font-size:clamp(34px,7vw,62px)}
  .menu{gap:4px}
  .mrow{padding:6px 10px}
  .footbar{padding-top:8px}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div id="app"></div>
<div id="vig"></div><div id="grain"></div><div id="scan"></div>

<!-- ================= HUD ================= -->
<div id="hud">
  <div class="hpwrap"><div id="hearts"></div><div id="buffs"></div></div>
  <div id="prog"><i class="a">◈</i><div id="progfill"></div><i class="b">⬟</i></div>
  <div class="topright">
    <div id="stgChip">STAGE 01</div><div id="stgName">―</div><div id="timer">00:00</div><div id="gemline">◆ 0 / 0</div>
  </div>
  <div id="hudbtns">
    <button class="ico-btn" id="btnPause" title="Pause">▮▮</button>
    <button class="ico-btn" id="btnSndHud">♪</button>
  </div>

  if(keys.has('KeyW')||keys.has('ArrowUp'))z+=1; if(keys.has('KeyS')||keys.has('ArrowDown'))z-=1;

function step(dt){

  // ---- buffs
  for(const k in player.buffs)player.buffs[k]=Math.max(0,player.buffs[k]-dt);
  player.inv=Math.max(0,player.inv-dt); player.atk=Math.max(0,player.atk-dt); player.atkCd=Math.max(0,player.atkCd-dt);
  player.dash=Math.max(0,player.dash-dt); player.dashCd=Math.max(0,player.dashCd-dt);
  // ---- movers / crumbles
  level.movers.forEach(s=>{const prev={x:s.cx,y:s.cy,z:s.cz};
    const t=total;
    if(s.axis==='x')s.cx=s.base.x+Math.sin(t*.7+s.ph)*s.amp; else s.cy=s.base.y+Math.sin(t*.9+s.ph)*s.amp*.55;
    s.mesh.position.set(s.cx,s.cy,s.cz); s.vx=s.cx-prev.x; s.vy=s.cy-prev.y; s.vz=s.cz-prev.z;});

  const inp=readInput(); const spd=(7.4*(player.buffs.boots>0?1.45:1))*(player.buffs.star>0?1.15:1);
  const fx=-Math.sin(camYaw),fz=-Math.cos(camYaw);
  const dx=fx*inp.z+(-fz)*inp.x, dz=fz*inp.z+(fx)*inp.x;
  const acc=player.grounded?52:24;
  const tvx=dx*spd, tvz=dz*spd;
  if(player.dash<=0){
    player.vel.x+=(tvx-player.vel.x)*Math.min(1,acc*dt/Math.max(1,spd));

    player.vel.x=ux*19;player.vel.z=uz*19;player.vel.y=Math.max(player.vel.y,1.5);player.inv=Math.max(player.inv,.28);
    Sound.play('dash');P.burst(player.pos,0x9fd0ff,10,4,.45,.16,.4)}
  // attack
  if((btnEdge.atk||btnEdge.KeyJ)&&player.atkCd<=0){
    player.atkCd=.36;player.atk=.22;player.slash.visible=true;Sound.play('atk');
    const ax=player.pos.x+Math.sin(player.yaw)*1.4,az=player.pos.z+Math.cos(player.yaw)*1.4;
    P.burst(new THREE.Vector3(ax,player.pos.y+.9,az),0xfff0c0,6,3.5,.3,.13,.2);
    hitEnemies(ax,az,3.2,(player.buffs.power>0?2:1));

  if(player.slash.visible){const k=1-player.atk/.22;player.slash.rotation.y=k*2.4;player.slash.scale.setScalar(.7+k*.7)}

  if(player.grounded){player.jumps=0;if(player.vel.y<-22)Sound.play('land')}

  level.enemies.forEach(e=>{if(e.dead)return;
    const d=Math.hypot(e.pos.x-player.pos.x,e.pos.z-player.pos.z);
    const vy=player.vel.y;
    if(d<e.r+.55&&player.pos.y>e.pos.y+.4&&player.pos.y-e.pos.y<2.6&&vy<-2&&player.atk<=0){

  level.hazards.forEach(h=>{

    }else if(h.type==='spike'){
      if(Math.abs(player.pos.x-h.x)<h.r&&Math.abs(player.pos.z-h.z)<h.r&&player.pos.y<1.5)hurt(h.dmg,new THREE.Vector3(h.x,0,h.z));

        if(h.cool<=0&&Math.random()<.01){}}
    }

  });
  // pickups
  const magR=player.buffs.magnet>0?7.5:1.25;
  level.pickups.forEach(p=>{if(p.taken)return;
    const d=p.pos.distanceTo(player.pos.clone().setY(player.pos.y+.8));
    if(player.buffs.magnet>0&&d<7.5)p.pos.lerp(player.pos.clone().setY(player.pos.y+.8),Math.min(1,dt*6));

  // checkpoints
  level.cp.forEach(c=>{if(c.active)return;
    if(Math.abs(c.x-player.pos.x)<1.6&&Math.abs(c.z-player.pos.z)<2.4){c.active=true;c.core.material.color.setHex(0x5fe3c0);c.halo.material.color.setHex(0x5fe3c0);
      level.respawn=c;Sound.play('cp');toast(t('ui.cp'));P.burst(new THREE.Vector3(c.x,2.7,c.z),0x5fe3c0,26,6,1,.22,.5)}});
  // goal
  const gz=level.goal.z;
  if(Math.abs(player.pos.x)<3&&Math.abs(player.pos.z-gz)<2.2&&player.pos.y<4.5){
    if(level.goal.locked){if(player.keys>=level.goal.need){level.goal.locked=false;level.goal.ring.material.color.setHex(0x5fe3c0);
        level.goal.inner.material.color.setHex(0x5fe3c0);level.goal.glow.material.color.setHex(0x5fe3c0);toast(t('ui.goal'));Sound.play('cp')}
      else if(level.goal.cool<=0){level.goal.cool=1.6;Sound.play('lock');toast(t('ui.needkey')+' '+player.keys+'/'+level.goal.need,'warn')}}
    else clearStage();
  }
  level.goal&&(level.goal.cool=Math.max(0,(level.goal.cool||0)-dt));
  // fall
  if(player.pos.y<level.minY-16){ hurt(1,null,true) }
  // enemies / shots

  const mv=Math.hypot(player.vel.x,player.vel.z);
  if(mv>.5){const ty=Math.atan2(player.vel.x,player.vel.z);player.yaw=player.yaw+Math.atan2(Math.sin(ty-player.yaw),Math.cos(ty-player.yaw))*Math.min(1,dt*14)}
  player.obj.rotation.y=player.yaw;
  const bob=player.grounded?Math.sin(total*13)*Math.min(mv,7)*.012:0;
  player.obj.position.y+=bob;
  player.body.scale.set(1+Math.sin(total*9)*.02,1-Math.sin(total*9)*.02*(player.grounded?1:-1),1);
  player.blade.rotation.x=player.atk>0?-1.5*(player.atk/.22):Math.sin(total*6)*.06;
  player.obj.visible=!(player.inv>0&&Math.floor(total*18)%2===0&&player.dead===false&&player.hitFlash);
  // blob shadow
  let sy=null; for(const s of level.solids){ if(player.pos.x>s.minX-.2&&player.pos.x<s.maxX+.2&&player.pos.z>s.minZ-.2&&player.pos.z<s.maxZ+.2&&s.top()<=player.pos.y+.1){ if(sy===null||s.top()>sy)sy=s.top() } }

  if(sy!==null){player.blob.position.set(player.pos.x,sy+.04,player.pos.z);const h=clamp(1-(sy-player.pos.y)/9,0,1);player.blob.scale.setScalar(.5+h*1.2);player.blob.material.opacity=.34*h}
  if(player.buffs.star>0)haloStar();
  // death plane particles
  stageTime+=dt;
  if(player.hp<=0)die();
}
function haloStar(){ if(total%0.06<0.016)P.burst(player.pos.clone().setY(player.pos.y+1),0xfff0a0,3,2,.4,.14,.1) }
function moveAxis(a,amt){
  if(!amt)return; player.pos[a]+=amt;
  for(const s of level.solids){
    if(s.ghost||s.skip)continue;

function hurt(dmg,from,fall){

function updateEnemies(dt){
  level.enemies.forEach(e=>{if(e.dead)return;
    const p=player.pos, to=p.clone().sub(e.pos), d=Math.hypot(to.x,to.z), dy=p.y-e.pos.y;

    e.parts.forEach(m=>{if(m.material.emissive)m.material.emissive.setHex(em)});
    e.timer+=dt;
    switch(e.type){
      case 'slime':{
        e.anim.t=(e.anim.t||0)+dt;
        const hop=near&&e.anim.t> .0?Math.abs(Math.sin((e.anim.t)*3)):0;

        e.pos.y+=Math.sin(total*2.6+e.ph)*dt*.9;
        if(e.g.userData.wings)e.g.userData.wings.forEach((w,i)=>w.rotation.y=Math.sin(total*16+i*3)*.9);
        e.g.rotation.y=Math.atan2(to.x,to.z);}break;
      case 'golem':{
        if(near){const l=Math.hypot(to.x,to.z)||1;e.pos.x+=to.x/l*e.spd*dt;e.pos.z+=to.z/l*e.spd*dt}
        e.pos.y=e.seg.y+Math.abs(Math.sin(total*2+e.ph))*.12;
        e.g.rotation.y=lerp(e.g.rotation.y,Math.atan2(to.x,to.z),dt*3);

      case 'lance':{
        if(e.state===0){ if(near&&e.cool<=0){e.state=1;e.cool=1.1;e.dir=to.clone().setY(0).normalize();
            P.burst(e.pos.clone().setY(e.pos.y+.6),0xff8a3a,10,4,.4,.16,.3)}
          e.pos.y=e.seg.y+Math.sin(total*3+e.ph)*.05;

          e.pos.x+=e.dir.x*e.spd*dt;e.pos.z+=e.dir.z*e.spd*dt;e.pos.y=e.seg.y;
          if(e.cool<=0){e.state=0;e.cool=1.4}

          if(Math.abs(dx)>e.seg.w/2+2||Math.abs(dz)>e.seg.len/2+2){e.pos.x=e.home.x;e.pos.z=e.home.z;e.state=0;e.cool=1}

        break;}

        if(e.state===1){e.cool-=dt;const f=Math.sin(total*30)>.0;e.parts[0].material.color.setHex(f?0xffffff:0xff3300);
          e.parts.forEach(pp=>{if(pp.material.emissive)pp.material.emissive.setHex(f?0xff3300:0)})}

        else if(e.phase==='slam'){
          if(e.pt<.6&&e.pt+dt>=.6){e.slam=1;e.parts.forEach(m=>{if(m.material.emissive)m.material.emissive.setHex(0)});
            P.burst(e.pos.clone().setY(e.pos.y+.2),0xffb03a,50,10,1.1,.34,.8);Sound.play('boom');
            if(Math.hypot(player.pos.x-e.pos.x,player.pos.z-e.pos.z)<6.5&&player.pos.y<e.pos.y+1.5)hurt(2,e.pos)}
          e.g.position.y=e.seg.y+ (e.pt>.6? (1.1-e.pt)*3 : Math.max(0,(e.pt))*0);
        }
        else if(e.phase==='cast'){
          if(e.shotT==null)e.shotT=0; e.shotT-=dt;
          if(e.shotT<=0&&e.shotsN<10){e.shotsN=(e.shotsN||0)+1;e.shotT=.12;
            const a=Math.random()*6.28,v=new THREE.Vector3(Math.cos(a),.35+Math.random()*.3,Math.sin(a)).normalize();shoot(e,v,10,1,true)}
          if(e.pt<=0){e.shotsN=0;e.phase='idle';e.pt=1.4}}
        else if(e.phase==='charge'){
          if(e.pt>.55){e.dir=e.dir||to.clone().setY(0).normalize();e.pos.x+=e.dir.x*13*dt;e.pos.z+=e.dir.z*13*dt;
            if(d<3)hurt(1,e.pos);}
          else{e.dir=null;e.phase='idle';e.pt=1.5;e.parts.forEach(m=>{if(m.material.emissive)m.material.emissive.setHex(0)})}
          const lim=e.seg;e.pos.x=clamp(e.pos.x,lim.x-lim.w/2+1,lim.x+lim.w/2-1);e.pos.z=clamp(e.pos.z,lim.z-lim.len/2+1,lim.z+lim.len/2-1);
        }
        if(e.phase!=='slam')e.g.position.y=e.seg.y;
        $('#bossfill').style.width=(e.hp/e.max*100)+'%';
        break;}
    }
    if(!e.boss&&e.type!=='obelisk'&&e.type!=='spore'){e.cool=Math.max(0,e.cool-dt)}
    else e.cool=Math.max(0,e.cool-dt);
  });
}
function shoot(e,dir,spd,life,straight){
  const m=new THREE.Mesh(new THREE.SphereGeometry(.22,8,6),basicMat(e.type==='spore'?0xd8ff9a:(e.glowCol||0xff5f8f)));
  m.position.copy(e.pos).setY(e.pos.y+(e.boss?3.4:1));
  level.group.add(m);
  const v=dir.clone().normalize().multiplyScalar(spd);
  level.shots.push({m,v,straight:!!straight,life:2.6});
  Sound.play('hit');
}
function updateShots(dt){
  for(let i=level.shots.length-1;i>=0;i--){const s=level.shots[i];
    s.life-=dt; if(!s.straight)s.v.y-=9*dt;
    s.m.position.addScaledVector(s.v,dt);
    if(s.m.position.distanceTo(player.pos.clone().setY(player.pos.y+.8))<.75){hurt(1,s.m.position);kill(s,i);continue}
    let hit=false; for(const so of level.solids){if(so.ghost)continue;
      if(s.m.position.x>so.minX&&s.m.position.x<so.maxX&&s.m.position.y>so.minY&&s.m.position.y<so.maxY&&s.m.position.z>so.minZ&&s.m.position.z<so.maxZ){hit=true;break}}
    if(hit||s.life<=0||s.m.position.y<-20)kill(s,i)}
  function kill(s,i){P.burst(s.m.position,0xffffff,5,3,.3,.12,.6);level.group.remove(s.m);s.m.geometry.dispose();level.shots.splice(i,1)}
}
function takeItem(p){
  p.taken=true;p.mesh.visible=false;
  const c=ITEMS[p.type].c;
  P.burst(p.pos,c,16,5,.7,.18,.4);
  switch(p.type){
    case 'gem':player.gems++;Sound.play('gem');break;
    case 'heart':player.hp=Math.min(player.maxhp,player.hp+1);Sound.play('item');updateHUD();break;
    case 'maxheart':player.maxhp++;player.hp=player.maxhp;Sound.play('clear');toast('MAX HP +1');updateHUD();break;
    case 'shield':player.buffs.shield=8;Sound.play('item');break;
    case 'boots':player.buffs.boots=10;Sound.play('item');break;
    case 'magnet':player.buffs.magnet=10;Sound.play('item');break;
    case 'wing':player.buffs.wing=1e9;Sound.play('item');toast(t('items.wing.n'));break;
    case 'power':player.buffs.power=10;Sound.play('item');break;
    case 'star':player.buffs.star=6;Sound.play('clear');break;
    case 'clock':player.buffs.clock=6;Sound.play('item');break;
    case 'key':player.keys++;Sound.play('cp');toast(t('items.key.n')+' '+player.keys+'/'+(level.goal?level.goal.need:1));break;
  }
  save.seen=save.seen||{};save.seen[p.type]=1;persist();
  updateHUD();
}

/* ============================================================
   10. CAMERA
============================================================ */
const camTgt=new THREE.Vector3();
function updateCamera(dt,free){
  if(free){const a=total*.11;const r=17;
    const f=level.start||new THREE.Vector3();
    camera.position.set(f.x+Math.cos(a)*r,f.y+8+Math.sin(a*.6)*2.4,f.z+Math.sin(a)*r);
    camera.lookAt(f.x,f.y+2,f.z+6); sky.position.copy(camera.position); return}
  camTgt.lerp(player.pos.clone().setY(player.pos.y+1.15),Math.min(1,dt*7));
  // auto follow yaw slowly when idle
  if(joyId===null&&lookId===null){const want=Math.atan2(-Math.sin(camYaw)*0+0,0)+ (0);
    // ease toward corridor direction (+Z)
    const target=Math.PI;camYaw+=Math.atan2(Math.sin(target-camYaw),Math.cos(target-camYaw))*dt*.12}
  let dist=camDist;
  const dir=new THREE.Vector3(Math.sin(camYaw)*Math.cos(camPitch),Math.sin(camPitch),Math.cos(camYaw)*Math.cos(camPitch));
  for(let s=.5;s<dist;s+=.5){const px=camTgt.x+dir.x*s,py=camTgt.y+dir.y*s,pz=camTgt.z+dir.z*s;
    for(const so of level.solids){if(so.ghost)continue;
      if(px>so.minX-.35&&px<so.maxX+.35&&py>so.minY-.35&&py<so.maxY+.35&&pz>so.minZ-.35&&pz<so.maxZ+.35){dist=Math.max(2.6,s-.5);break}}}
  camera.position.copy(camTgt).addScaledVector(dir,dist);
  camera.lookAt(camTgt);
  sky.position.copy(camera.position);
  sun.position.copy(player.pos).add(new THREE.Vector3(24,36,14)); sun.target.position.copy(player.pos); sun.target.updateMatrixWorld();
}

/* ============================================================
   11. HUD / UI
============================================================ */
let hudCache={hp:-1,max:-1,buffs:'',keys:-1};
function updateHUD(){
  const hs=$('#hearts');
  if(hudCache.hp!==player.hp||hudCache.max!==player.maxhp){hudCache.hp=player.hp;hudCache.max=player.maxhp;
    hs.innerHTML=Array.from({length:player.maxhp},(_,i)=>`<div class="ht ${i<player.hp?'':'off'} ${i>=3?'max':''}">♥</div>`).join('')}
  const bs=Object.entries(player.buffs).filter(([k,v])=>v>0&&v<1e8).map(([k,v])=>k+':'+Math.ceil(v)).join(' ');
  if(bs!==hudCache.buffs){hudCache.buffs=bs;$('#buffs').innerHTML=Object.entries(player.buffs).filter(([k,v])=>v>0&&v<1e8).map(([k,v])=>`<span class="buff">${k.toUpperCase()} ${Math.ceil(v)}</span>`).join('')}
  const gl=$('#gemline'); gl.textContent='◆ '+player.gems+(level.gemTotal?' / '+level.gemTotal:'')+(level.goal&&level.goal.need?'   ⚿ '+player.keys+'/'+level.goal.need:'');
  $('#timer').textContent=mmss(stageTime);
  const pr=clamp((player.pos.z-(level.start?level.start.z:0))/Math.max(1,(level.goalZ-(level.start?level.start.z:0))),0,1);
  $('#progfill').style.width=(pr*100).toFixed(1)+'%';
}
function toast(txt,cls){const d=document.createElement('div');d.className='toast '+(cls||'');d.textContent=txt;$('#toasts').appendChild(d);
  setTimeout(()=>{d.style.transition='.4s';d.style.opacity='0';d.style.transform='translateY(-10px)'},1300);setTimeout(()=>d.remove(),1800)}
function updateHUDLight(){$('#timer').textContent=mmss(stageTime);
  const pr=clamp((player.pos.z-(level.start?level.start.z:0))/Math.max(1,(level.goalZ-(level.start?level.start.z:0))),0,1);
  $('#progfill').style.width=(pr*100).toFixed(1)+'%'}

function renderTitle(){
  $('#tvProg').textContent=Math.min(save.unlocked,STAGES.length)+'/'+STAGES.length;
  $('#tvClear').textContent=Object.keys(save.cleared).length;
  $('#tvKill').textContent=save.kills||0;
  $('#pips').innerHTML=STAGES.map((s,i)=>`<div class="pip ${save.cleared[i]?'done':(i<save.unlocked?'un':'')}" title="${t('names.'+i)}"></div>`).join('');
  $('#mPlay').toggleAttribute('disabled',!(save.unlocked>1));
  $('#mPlay').querySelector('.sub').textContent=save.unlocked>1?('STAGE '+String(save.unlocked).padStart(2,'0')):'—';
}
function renderGrid(){
  $('#stageGrid').innerHTML=STAGES.map((s,i)=>{
    const th=THEMES[i],c='#'+th.acc.toString(16).padStart(6,'0'),c2='#'+th.cap.toString(16).padStart(6,'0');
    const lock=i+1>save.unlocked, b=save.best[i];
    return `<button class="card ${lock?'lock':''}" data-go="${i}" style="--c:${c};--c2:${c2}">
      ${lock?'<span class="lk">🔒</span>':''}
      <span class="num">${String(i+1).padStart(2,'0')}</span>
      <span class="nm">${t('names.'+i)}${s.boss?' <span style="color:var(--coral)">BOSS</span>':''}</span>
      <span class="meta"><span class="stars">${'★'.repeat(s.lv)}<span style="opacity:.25">${'★'.repeat(6-s.lv)}</span></span>
      <span class="bb">${b?mmss(b.time):'--:--'}</span></span></button>`}).join('');
  $$('[data-go]').forEach(b=>b.onclick=()=>{startStage(+b.dataset.go)});
}
function renderCodex(){
  const M=Object.keys(MON), I=Object.keys(ITEMS);
  const sw={slime:0x9b45d8,wisp:0xff5f8f,golem:0x6d6a5c,spore:0x6ac04a,lance:0xff8a3a,obelisk:0x9fd0ff,pim:0xd04040,titan:0xff6a3a};
  $('#codexMon').innerHTML=M.map(k=>`<div class="row"><div class="ico" style="background:#${sw[k].toString(16).padStart(6,'0')};color:#${sw[k].toString(16).padStart(6,'0')}"></div>
    <div><b>${t('mons.'+k+'.n')}</b><span>${t('mons.'+k+'.d')} · HP ${MON[k].hp} · DMG ${MON[k].dmg}</span></div></div>`).join('');
  $('#codexItem').innerHTML=I.map(k=>`<div class="row"><div class="ico" style="background:#${ITEMS[k].c.toString(16).padStart(6,'0')};color:#${ITEMS[k].c.toString(16).padStart(6,'0')}"></div>
    <div><b>${t('items.'+k+'.n')}</b><span>${t('items.'+k+'.d')}</span></div></div>`).join('');
}
function renderHow(){
  const pc=t('how.pc').map(l=>`<div class="kv"><b>PC</b><span>${l}</span></div>`).join('');
  const tc=t('how.touch').map(l=>`<div class="kv"><b>TOUCH</b><span>${l}</span></div>`).join('');
  $('#howCtrl').innerHTML=`<h4>${t('ui.ctrl')}</h4>${pc}${tc}<div class="kv"><b>KEYS</b><span>ESC ${t('ui.paused')} · M SOUND</span></div>`;
  $('#howObj').innerHTML=`<h4>${t('ui.obj')}</h4>${t('how.obj').map(l=>`<div class="kv"><b>▸</b><span>${l}</span></div>`).join('')}`;
}
function show(sel){$$('.screen').forEach(s=>s.classList.remove('show'));if(sel)$(sel).classList.add('show')}
function hideAll(){show(null)}
function setMenu(m){mode=m;
  $('#hud').classList.toggle('show',m==='play'||m==='pause'||m==='dead'||m==='clear');
  $('#touch').classList.toggle('on',(m==='play')&&isTouch);
  menuMode=(m==='title'||m==='select'||m==='codex'||m==='how');
}

/* ============================================================
   12. FLOW
============================================================ */
function startStage(i){
  stageIdx=i; Sound.init();
  r01=mulberry32(STAGES[i].seed+137);
  buildLevel(i);
  level.gemTotal=level.pickups.filter(p=>p.type==='gem').length;
  player.pos.copy(level.start);player.pos.y+=1.2;player.vel.set(0,0,0);
  player.hp=player.maxhp=Math.min(6,3);player.maxhp=Math.max(3,Math.min(6,3));
  player.hp=player.maxhp;
  player.keys=0;player.gems=0;player.kills=0;player.inv=1;player.dead=false;
  for(const k in player.buffs)player.buffs[k]=0;
  level.respawn={x:level.start.x,y:level.start.y,z:level.start.z};
  stageTime=0;camYaw=Math.PI;camPitch=.4;
  $('#stgChip').textContent='STAGE '+String(i+1).padStart(2,'0');
  $('#stgName').textContent=t('names.'+i);
  $('#bossbar').classList.remove('show');
  hudCache={hp:-1,max:-1,buffs:'',keys:-1};updateHUD();
  hideAll();setMenu('play');
}
function pause(){if(mode!=='play')return;mode='pause';$('#touch').classList.remove('on');
  $('#pTime').textContent=mmss(stageTime);$('#pGems').textContent=player.gems;$('#pKills').textContent=player.kills;
  $('#pSnd').textContent=Sound.on()?'♪ ON':'✕ OFF';$('#m-pause').classList.add('show')}
function resume(){if(mode!=='pause')return;$('#m-pause').classList.remove('show');mode='play';if(isTouch)$('#touch').classList.add('on')}
function toTitle(){clearLevel();buildLevel(0);player.pos.copy(level.start);mode='title';setMenu('title');
  $$('.screen').forEach(s=>s.classList.remove('show'));$('#s-title').classList.add('show');renderTitle()}
function clearStage(){
  if(mode!=='play')return;mode='clear';player.dead=true;$('#touch').classList.remove('on');
  Sound.play('clear');P.burst(player.pos.clone().setY(player.pos.y+1),0x5fe3c0,60,9,1.4,.26,.2);
  const i=stageIdx, prev=save.best[i];
  const rec=!prev||stageTime<prev.time;
  save.best[i]={time:stageTime,gems:player.gems};save.cleared[i]=1;save.unlocked=Math.max(save.unlocked,Math.min(STAGES.length,i+2));
  persist();
  $('#rTitle').textContent=t('names.'+i);
  $('#rTime').textContent=mmss(stageTime);$('#rGems').textContent=player.gems;$('#rKills').textContent=player.kills;
  $('#rBest').textContent=mmss(save.best[i].time);
  $('#rRec').innerHTML=rec?'<span class="newrec">NEW RECORD</span>':'';
  $('#rNext').style.display=(i+1<STAGES.length)?'':'none';
  $('#m-result').classList.add('show');
}
function die(){if(mode!=='play')return;mode='dead';player.dead=true;Sound.play('die');$('#touch').classList.remove('on');
  P.burst(player.pos.clone().setY(player.pos.y+1),0xff5f52,40,8,1.2,.26,1);$('#m-dead').classList.add('show')}
function retry(){startStage(stageIdx)}

/* ============================================================
   13. WIRING
============================================================ */
$('#mPlay').onclick=()=>startStage(Math.min(save.unlocked,STAGES.length)-1);
$('#mNew').onclick=()=>{save.best={};save.cleared={};save.unlocked=1;save.kills=0;persist();renderTitle();startStage(0)};
$('#mSelect').onclick=()=>{show('#s-select');setMenu('select')};
$('#mCodex').onclick=()=>{show('#s-codex');setMenu('codex')};
$('#mHow').onclick=()=>{show('#s-how');setMenu('how')};
$$('[data-back]').forEach(b=>b.onclick=()=>{show('#s-title');setMenu('title')});
$('#btnPause').onclick=pause;$('#pResume').onclick=resume;$('#pRetry').onclick=()=>{$('#m-pause').classList.remove('show');retry()};
$('#pMenu').onclick=()=>{$('#m-pause').classList.remove('show');toTitle()};
$('#pSnd').onclick=()=>{Sound.setSound(!Sound.on());$('#pSnd').textContent=Sound.on()?'♪ ON':'✕ OFF'};
$('#btnSndHud').onclick=()=>Sound.setSound(!Sound.on());
$('#rAgain').onclick=()=>{$('#m-result').classList.remove('show');retry()};
$('#rNext').onclick=()=>{$('#m-result').classList.remove('show');startStage(Math.min(stageIdx+1,STAGES.length-1))};
$('#rMenu').onclick=()=>{$('#m-result').classList.remove('show');toTitle()};
$('#dRetry').onclick=()=>{$('#m-dead').classList.remove('show');retry()};
$('#dMenu').onclick=()=>{$('#m-dead').classList.remove('show');toTitle()};
$('#sndA').onclick=()=>Sound.setSound(!Sound.on());
$('#qA').onclick=()=>{setQuality('high')};$('#qB').onclick=()=>{setQuality('low')};
function setQuality(q){save.quality=q;persist();
  $('#qA').classList.toggle('on',q==='high');$('#qB').classList.toggle('on',q!=='high');
  renderer.setPixelRatio(q==='high'?Math.min(devicePixelRatio,2):1);
  renderer.shadowMap.enabled=q==='high'; sun.castShadow=q==='high'; scene.traverse(o=>{if(o.material)o.material.needsUpdate=true});
}
['ja','en','zh','es','fr'].forEach(L=>{const b=document.createElement('button');b.className='chip';b.textContent=L.toUpperCase();
  b.onclick=()=>{LANG=L;persist();applyI18n();$$('[id=langRow] .chip').forEach(c=>c.classList.toggle('on',c===b))};$('#langRow').appendChild(b);
  if(L===LANG)b.classList.add('on')});
function checkRotate(){const p=innerHeight>innerWidth&&Math.min(innerWidth,innerHeight)<820;
  $('#rotate').style.display=p?'grid':'none'}
addEventListener('orientationchange',()=>setTimeout(()=>{checkRotate();resize()},220));
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);checkRotate()}
addEventListener('resize',resize);
if(isTouch)renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
setQuality(save.quality||'high');

/* ============================================================
   14. LOOP
============================================================ */
let frames=0,acc=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.045,(now-last)/1000)||0;last=now;total+=dt;
  // ambient
  if(level.clouds){level.clouds.position.x=Math.sin(total*.05)*6}
  level.decor.forEach(d=>{if(d.spin)d.s.rotation.y+=dt*d.spin;if(d.s&&d.ph!==undefined)d.s.material.opacity=.35});
  level.group.children.forEach(()=>{});
  level.pickups.forEach(p=>{if(p.taken)return;p.mesh.rotation.y+=dt*2.2;p.mesh.position.y=p.pos.y+Math.sin(total*2.4+p.ph)*.16});
  level.cp.forEach(c=>{c.core.rotation.y+=dt*1.4;c.core.scale.setScalar(1+Math.sin(total*3+c.x)*.07)});
  if(level.goal){level.goal.ring.rotation.z+=dt*.4;level.goal.mesh.position.y=3+Math.sin(total*1.2)*.12;
    level.goal.inner.material.opacity=.16+Math.sin(total*3)*.05}
  if(mode==='play'){
    step(dt); updateCamera(dt,false); updateHUDLight();
    if(joyId===null&&lookId===null&&Math.floor(total*30)%3===0){$('#bossfill').style.width=player.boss?(player.boss.hp/player.boss.max*100)+'%':'0%'}
  }else{
    if(player.boss)$('#bossfill').style.width=(player.boss.hp/player.boss.max*100)+'%';
    updateCamera(dt,menuMode);
  }
  P.update(dt);
  renderer.render(scene,camera);
  consumeEdges();
  // auto quality
  frames++;acc+=dt;if(acc>2.5){if(frames/acc<34&&save.quality==='high'&&isTouch)setQuality('low');frames=0;acc=0}
}

/* ---------- boot ---------- */
applyI18n();
buildLevel(0); player.pos.copy(level.start); level.respawn={x:level.start.x,y:level.start.y,z:level.start.z};
player.obj.position.copy(level.start);
$('#sndA').textContent=Sound.on()?'♪ ON':'✕ OFF';
checkRotate(); setMenu('title'); requestAnimationFrame(loop);
document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
